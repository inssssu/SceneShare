<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function() {
            $("#btn-search").on("click", function() {
                const text = $("#search-movie").val();
                const sendData = {searchMovie: text};

                $.ajax({
                    url: "/main/searchResult",
                    type: "GET",
                    data: sendData,
                    success: function(data) {
                        console.log(data);

                        if (data != null && data.length > 0) {
                            const tableBody = $("#tb-list > tbody");
                            tableBody.empty();

                            for (let i = 0; i < data.length; i++) {
                                let tag = "<tr>";
                                tag += "<td>" + data[i].text + "</td>";
                                tag += "</tr>";

                                tableBody.append(tag);
                            }
                        }
                        else {
                            alert("조회된 데이터가 없습니다.");
                        }
                    },
                    error: function() {
                        alert("검색 중 오류가 발생했습니다.");
                    }
                });
            });
        });
    </script>
</head>
<body>

<main class="container mt-5">
    <section>
        <div class="row">
            <div class="col-sm">
                <a href="/main" th:href="@{/main}">로고</a>
                <input type="text" class="form-control" id="search-movie" placeholder="검색할 단어를 입력하세요">
                <button type="button" class="btn btn-primary" id="btn-search">검색</button>
                <div class="text-end">
                    <a href="/user/login.do" th:href="@{/user/login.do}">로그인</a>
                    <a href="/user/logout.do" th:href="@{/user/logout.do}">로그아웃</a>
                </div>
                <table class="table table-hover table-striped" id="tb-list">
                    <thead>
                    <tr>
                        <th>"<span th:text="${searchMovie}"></span>"의 검색 결과</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:if="${#lists.size(movie.titleList)} > 0" th:each="item : ${movie.titleList}">
                        <td th:text="${item.movieTitle}">영화 제목</td>
                        <td th:text="${item.movieGenre}">영화 줄거리</td>
                        <td th:text="${item.movieDirector}">영화 감독</td>
                    </tr>
                    <tr th:unless="${#lists.size(movie)} > 0">
                        <td colspan="5">조회된 데이터가 없습니다.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </section>
</main>

</body>
</html>
