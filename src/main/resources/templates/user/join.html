<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            $("#frm").on("submit", function(e) {
                let flagUserId = $("#user-id").val().trim();
                let flagUserPw = $("#user-pw").val().trim();
                let flagUserName = $("#user-name").val().trim();
                let flagUserGender = $("#user-gender option:selected").val().trim();

                if (flagUserId == "") {
                    alert("아이디를 입력해주세요");
                    $("#user-id").focus();
                    e.preventDefault();
                    return;
                }

                if (flagUserId == "") {
                    alert("중복되는 아이디입니다.");
                    $("#user-id").focus();
                    e.preventDefault();
                    return;
                }

                if (flagUserPw == "") {
                    alert("비밀번호를 입력해주세요")
                    $("#user-pw").focus();
                    e.preventDefault();
                    return;
                }

                if (flagUserName == "") {
                    alert("이름을 입력해주세요");
                    $("#user-name").focus();
                    e.preventDefault();
                    return;
                }

                if (flagUserGender == "") {
                    alert("성별을 입력해주세요");
                    $("#user-gender").focus();
                    e.preventDefault();
                    return;
                }

                alert("회원가입이 완료되었습니다");
            });
        });
    </script>
</head>
<body>

<main class="row mt-5">
    <section>
        <div class="row mt-3">
            <div class="col-sm-4 mx-auto">
                <form action="/user/create" method="post" id="frm">
                    <div class="mt-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="user-id" name="userId" placeholder="ID">
                            <label for="user-id">ID</label>
                        </div>
                    </div>
                    <div class="mt-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="user-pw" name="userPw" placeholder="Password">
                            <label for="user-pw">Password</label>
                        </div>
                    </div>
                    <div class="mt-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="user-name" name="userName" placeholder="Name">
                            <label for="user-name">Name</label>
                        </div>
                    </div>
                    <div class="mt-3">
                        <div class="form-floating">
                            <input type="text" class="form-control" id="user-email" name="userEmail" placeholder="Email">
                            <label for="user-email">Email</label>
                        </div>
                    </div>
                    <div class="container mt-2 p-2">
                        <div class="row">
                            <div class="col-sm">
                                <select class="form-control me-3" id="user-gender" name="gender">
                                    <option value="" selected>성별을 선택하세요</option>
                                    <option value="Male">남성</option>
                                    <option value="Female">여성</option>
                                </select>
                            </div>
                        </div>
                    </div>
                    <div class="mt-3 d-grid gap-2">
                        <button type="submit" class="btn btn-primary">회원가입하기</button>
                    </div>
                </form>
            </div>
        </div>
    </section>
</main>

</body>
</html>
