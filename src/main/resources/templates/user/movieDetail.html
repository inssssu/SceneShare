<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function () {
            $("#btn-like").on('click', function () {
                alert("좋아요 버튼 클릭!!" + "\n" + "/user/likePost/" + $("#movie-id").val());

                $.ajax({
                    url: "/user/bookmarks/likePost/" + $("#movie-id").val(),
                    type: "POST",
                    success: function (data) {
                        alert("통신 성공 : " + data);
                    },
                    error: function (xhr, textStatus, errorThrown) {
                        console.log(xhr.responseText);
                        alert("통신 오류");
                    }
                });
            });
        });
    </script>

</head>
<body>

<main class="container mt-4">
    <form id="frm" method="get">
        <div class="row mt-3 justify-content-center">
            <div class="col-sm">
                <div class="input-group">
                    <span class="input-group-text">영화번호</span>
                    <input type="text" class="form-control" id="movie-id" name="movieId" readonly th:value="${movie.movieId}">
                </div>
            </div>
            <div class="col-sm-8">
                <div class="input-group">
                    <span class="input-group-text">영화제목</span>
                    <input type="text" class="form-control" name="movieTitle" readonly th:value="${movie.movieTitle}">
                </div>
            </div>
            <div class="col-sm-8">
                <div class="input-group mt-2">
                    <span class="input-group-text">평점</span>
                    <input type="text" class="form-control" name="rating" readonly th:value="${movie.rating}">
                </div>
            </div>
            <div class="col-sm-8">
            </div>
            <button type="button" class="btn btn-primary mt-3" id="btn-like">좋아요</button>
        </div>
    </form>

<!--    <form action="/movieDetail/{movieId}" method="post" class="mt-3">-->
    <form action="/movieDetail/" th:action="@{|/movieDetail/${movie.movieId}|}" method="post" class="mt-3">
        <div class="border rounded-3 p-3">
            <div class="form-floating mt-3">
                <input type="text" class="form-control" id="title" name="title" placeholder="제목">
                <label for="title">제목</label>
            </div>
            <div class="form-floating mt-3">
                <textarea class="form-control" id="contents" name="contents" placeholder="내용" style="height: 150px;"></textarea>
                <label for="contents">내용</label>
            </div>
            <hr>
            <div class="d-grid gap-2 mb-3">
                <button type="submit" class="btn btn-primary">저장</button>
            </div>
        </div>
    </form>
</main>

</body>
</html>
