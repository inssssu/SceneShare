<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Detail</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr"
          crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q"
            crossorigin="anonymous"></script>

    <script th:inline="javascript">
        const session = /*[[${session}]]*/ {};
    </script>

    <script>
        $(function () {
            $('#btn-like').on('click', function () {
                $.ajax({
                    url: '/user/bookmarks/likePost/' + $('#movie-id').val(),
                    type: 'POST',
                    success: data => alert(data),
                    error: xhr => {
                        if (xhr.status === 401) {
                            alert(JSON.parse(xhr.responseText).msg);
                            location.href = '/login';
                        } else {
                            alert('에러 발생');
                        }
                    }
                });
            });

            $('#btn-ok').on('click', function () {
                if (session && session.userId) {
                    $('#div-modal').removeClass('d-none');
                } else {
                    alert('로그인이 필요한 서비스입니다.');
                    location.href = '/login';
                }
            });
        });
    </script>
</head>

<body>
<main class="container mt-4">
    <form id="frm" method="get">
        <div class="row mt-3 justify-content-center">
            <div class="col-sm">
                <div class="input-group">
                    <span class="input-group-text">영화번호</span>
                    <input type="text" class="form-control" id="movie-id" name="movieId"
                           readonly th:value="${movie.movieId}">
                </div>
            </div>

            <div class="col-sm-8">
                <div class="input-group">
                    <span class="input-group-text">영화제목</span>
                    <input type="text" class="form-control" name="movieTitle"
                           readonly th:value="${movie.movieTitle}">
                </div>
            </div>

            <div class="col-sm-8">
                <div class="input-group mt-2">
                    <span class="input-group-text">평점</span>
                    <input type="text" class="form-control" name="ratingAvg"
                           th:value="${rating}">
                </div>
            </div>

            <div class="col-sm">
                <div class="input-group mt-3">
                    <span class="input-group-text">게시글 갯수</span>
                    <input type="text" class="form-control" name="boardCnt"
                           th:value="${board}">
                </div>
            </div>

            <div class="col-sm-8">
                <button type="button" class="btn btn-primary mt-3" id="btn-like">좋아요</button>
            </div>
        </div>
    </form>

    <button type="button" class="btn btn-primary mt-4" id="btn-ok">등록</button>

    <div id="div-modal" class="d-none">
        <form th:action="@{|/movie/detail/${movie.movieId}|}" method="post" class="mt-3">
            <input type="hidden" name="movieId" th:value="${movie.movieId}">
            <input type="hidden" name="userId" th:value="${session.userId}">

            <div class="border rounded-3 p-3">
                <div class="form-floating mt-3">
                    <input type="text" class="form-control" id="title" name="title"
                           placeholder="제목" required>
                    <label for="title">제목</label>
                </div>

                <div class="form-floating mt-3">
                    <textarea class="form-control" id="contents" name="contents"
                              placeholder="내용" style="height:150px;" required></textarea>
                    <label for="contents">내용</label>
                </div>

                <div class="form-floating mt-3">
                    <input type="number" id="rating" name="rating"
                           min="0" max="5" step="1" class="form-control"
                           placeholder="평점" required>
                    <label for="rating">평점 (0~5)</label>
                </div>

                <hr>
                <button type="submit" class="btn btn-primary w-100">저장</button>
            </div>
        </form>
    </div>
</main>
</body>
</html>
