<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link rel="stylesheet" href="/css/commentDetail.css">
    <script src="/js/commentDetail.js"></script>



</head>
<body>
    <div class="container">
        <h1>사용자 활동 내역</h1>
        <!-- 사용자 요약 정보 -->
        <section class="user-summary">
            <p><strong>가입일 : </strong><span id="joinDate">2024-03-01</span></p>
            <p><strong>사용자 ID : </strong><span th:text="${user.username}" id="userId">user123</span></p>
            <p><strong>사용자 이름 : </strong><span th:text="${user.name}" id="userName">홍길동</span></p>
            <p><strong>총 작성 건수 : </strong><span id="totalCount">999999+</span></p>
            <p><strong>최근 작성일 : </strong><span id="lastDate">2025-07-16</span></p>
            <!-- 목록 버튼 추가 -->
            <a href="/admin/comment">목록</a>
        </section>
        <div id="commentSections"></div>
        <!-- 페이지네이션 버튼 -->
        <div id="pagination" class="pagination"></div>
    </div>
    <!-- 삭제 확인 모달 -->
    <div id="modalOverlay" class="modal-overlay" style="display: none">
        <div class="modal">
            <p>정말 삭제하시겠습니까?</p>
            <button class="confirm" onclick="deleteConfirmed()">삭제</button>
            <button class="cancel" onclick="closeModal()">취소</button>
        </div>
    </div>
<!-- 외부 JavaScript 파일 링크 -->
</body>
</html>
