<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script th:inline="javascript">
        let users = /*[[${userList}]]*/;
        console.log(users);
    </script>

    <script src="/js/userManagement.js"></script>

</head>
<body>

    <main class="container mt-5">
        <form th:action="@{/admin/userManagement/search}" method="get">
            <input type="text" name="keyword" placeholder="검색할 내용을 입력하세요">
            <button type="submit">검색</button>
        </form>
        <table class="table table-hover table-striped text-center">
            <colgroup>
                <col style="width: 10%">
                <col style="width: 30%">
                <col style="width: 30%">
                <col style="width: 30%">
            </colgroup>
            <thead>
            <tr>
                <th>번호</th>
                <th>사용자 ID</th>
                <th>이름</th>
                <th>상태</th>
            </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.size(userList)} > 0" th:each="item : ${userList}">
                    <td th:text="${item.userIdx}">1</td>
                    <td th:text="${item.username}">사용자 ID</td>
                    <td th:text="${item.name}">이름</td>
                    <td>상태</td>
                </tr>
                <tr th:unless="${#lists.size(userList)}">
                    <td colspan="5">조회된 데이터가 없습니다</td>
                </tr>
            </tbody>
        </table>
    </main>

</body>
</html>
