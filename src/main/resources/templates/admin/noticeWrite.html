<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Title</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

    <script>
        $(document).ready(function() {
            $("#btn-cancel").on("click", function() {
                history.back();
            });
        });
    </script>

</head>
<body>

    <main>
        <div class="container mt-4">
            <div class="row">
                <h2 class="text-center">공지사항 등록</h2>
                <div class="col-sm-7 mx-auto">
                    <form action="/admin/noticeWrite" method="post">
                        <div class="border rounded-3 p-3">
                            <div class="form-floating mt-3">
                                <input type="text" class="form-control" id="title" name="title" placeholder="제목">
                                <label for="title">제목</label>
                            </div>
                            <div class="form-floating mt-3">
                                <textarea class="form-control" id="contents" name="contents" style="height: 400px" placeholder="내용"></textarea>
                                <label for="contents">내용</label>
                            </div>
<!--                            <div class="mt-3">-->
<!--                                <input type="file" class="form-control" id="file" name="file">-->
<!--                            </div>-->
                            <div class="d-gird gap-2 mb-3">
                                <button type="submit" class="btn btn-primary">작성</button>
                                <button type="button" class="btn btn-secondary" id="btn-cancel">취소</button>
                            </div>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

</body>
</html>
