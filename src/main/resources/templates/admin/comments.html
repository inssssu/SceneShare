<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코멘트/댓글 관리자 페이지</title>
    <!-- CSS 파일 연결 -->
    <link rel="stylesheet" href="/css/comments.css">
</head>

<body>
    <div class="container">
        <!-- 관리자 페이지 제목 -->
        <h1>코멘트/댓글 관리자 페이지</h1>

        <!-- 검색바 입력 -->
        <div class="search-bar">
            <input type="text" id="searchUser" placeholder="사용자 ID, 이름 또는 코멘트 내용 검색" />
        </div>

        <!-- 사용자 테이블 -->
        <table class="user-table" id="userTable">
            <thead>
                <tr>
                    <th>번호</th>
                    <th onclick="sortTable('joinDate')">가입일</th>
                    <th>사용자 ID</th>
                    <th onclick="sortTable('name')">이름</th>
                    <th onclick="sortTable('status')">상태</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <!-- JavaScript로 사용자 목록이 렌더링될 영역 -->
            </tbody>
        </table>

        <!-- 페이징 영역 -->
        <div id="pagination" class="pagination"></div>
    </div>

    <!-- JavaScript 파일 연결 -->
    <script src="/js/comments.js"></script>
</body>
</html>
