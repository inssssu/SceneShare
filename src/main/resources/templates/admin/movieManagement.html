<body>

    <main class="container mt-5">
        <header th:replace="~{/admin/layout/header :: header}"></header>
        <h1>영화 정보 관리</h1>
        <div>
            <form th:action="@{/admin/movieManagement/search}" method="get">
                <select name="option" id="option">
                    <option value="all">전체</option>
                    <option value="notice">공지</option>
                    <option value="movie">영화</option>
                </select>
                <input type="text" name="keyword" placeholder="검색 내용 입력">
                <button type="submit">검색</button>
            </form>
        </div>
        <table class="table table-hover table-striped text-center">
            <colgroup>
                <col style="width: 10%">
                <col style="width: 15%">
                <col style="width: 15%">
                <col style="width: 40%">
                <col style="width: 10%">
                <col style="width: 10%">
            </colgroup>
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>감독</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.size(noticeList)} > 0" th:each="item : ${noticeList}">
                    <td th:text="${item.noticeId}"></td>
                    <td th:text="${item.title}"></td>
                    <td>작성자</td>
                    <td th:text="${item.contents}"></td>
                    <td>작성일</td>
                    <td>관리</td>
                </tr>
            </tbody>
            <tbody>
                <tr th:if="${#lists.size(movieList)} > 0" th:each="item : ${movieList}" id="list">
                    <td th:text="${item.movieId}"></td>
                    <td th:text="${item.title}"></td>
                    <td th:text="${item.director}"></td>
                    <td th:text="${item.description}"></td>
                    <td>작성일</td>
                    <td>관리</td>
                </tr>
<!--                <tr th:unless="${#lists.size(movieList)} > 0">-->
<!--                    <td colspan="6">작성된 게시글이 없습니다</td>-->
<!--                </tr>-->
            </tbody>
        </table>
        <div class="button-wrapper">
            <button class="register-btn" id="register-btn">게시물 등록</button>
        </div>
    </main>
