<body>

    <main class="container mt-5">
        <div class="management-card">
            <a href="/admin/userManagement">유저관리</a>
            <a href="/admin/movieManagement">영화 정보 관리</a>
            <a href="/admin/commentManagement">코멘트, 댓글 관리</a>
        </div>
        <h1>영화 정보 관리</h1>
        <div>
            <form class="search-container" th:action="@{/admin/movieManagement/search}" method="get">
                <select name="option" id="option">
                    <option value="all">전체</option>
                    <option value="notice">공지</option>
                    <option value="movie">영화</option>
                </select>
                <input type="text" name="keyword" placeholder="검색 내용 입력">
                <button type="submit">검색</button>
            </form>
        </div>
        <table class="table table-hover table-striped text-center">
            <colgroup>
                <col style="width: 10%">
                <col style="width: 15%">
                <col style="width: 45%">
                <col style="width: 10%">
                <col style="width: 10%">
                <col style="width: 10%">
            </colgroup>
            <thead class="table-light">
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>조회수</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody>
                <tr th:if="${#lists.size(movieList)} > 0" th:each="item : ${movieList}" id="list">
                    <td th:text="${item.movieId}">1</td>
                    <td th:text="${item.title}">제목</td>
                    <td th:text="${item.description}">내용</td>
                    <td th:text="${item.createDate}">작성일</td>
                    <td th:text="${item.hitCnt}">조회수</td>
                    <td>
                        <a class="btn btn-sm btn-outline-primary">수정</a>
                        <a class="btn btn-sm btn-outline-danger">삭제</a>
                    </td>
                </tr>
                <tr th:unless="${#lists.size(movieList)} > 0">
                    <td colspan="6">조회된 데이터가 없습니다.</td>
                </tr>
            </tbody>
        </table>
        <div class="button-wrapper">
            <a href="/admin/noticeWrite" class="btn btn-primary" id="register-btn">게시물 등록</a>
        </div>
    </main>
