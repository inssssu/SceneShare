<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>관리자 로그인</title>
    <link rel="stylesheet" href="/css/login.css" />
</head>

<body>
    <main class="container mt-4">
        <div class="row">
            <div class="col-sm-4 mx-auto">
                <form action="/admin/login" method="POST">
                    <div class="border border-rounded-3 p-3">
                        <div class="form-floating mt-3">
                            <input type="text" class="form-control" id="admin-name" name="adminName" placeholder="Admin ID">
                            <label for="admin-name">Admin ID</label>
                        </div>
                        <div class="form-floating mt-3">
                            <input type="text" class="form-control" id="admin-password" name="adminPassword" placeholder="Admin Password">
                            <label for="admin-password">Admin Password</label>
                        </div>
                        <hr>
                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary">로그인</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </main>
</body>
</html>
