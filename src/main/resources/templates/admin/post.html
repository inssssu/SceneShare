<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>게시물 관리</title>
    <!-- 게시물 관리용 CSS 외부 파일 연결 -->
    <link rel="stylesheet" href="/static/css/post-style.css">
    <script src="/static/js/post.js"></script>

</head>
<body>
    <h2>게시물 관리</h2>
    <!-- 게시물 테이블과 검색/필터 영역 포함 -->
    <div id="tableContainer">
        <div id="searchContainer">
            <!-- 필터 선택: 전체 / 공지 / 영화 -->
            <select id="filterType" name="option">
                <option value="all">전체</option>
                <option value="notice">공지</option>
                <option value="movie">영화</option>
            </select>
            <!-- 키워드 검색창: 제목, 내용, 작성자 -->
            <input type="text" id="searchInput" name="keyword" placeholder="제목, 내용 검색" />
        </div>
        <!-- 게시물 리스트 테이블 -->
        <table id="postTable">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th>작성일</th>
                    <th>조회수</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <!-- 등록 버튼 영역 -->
        <div class="button-wrapper">
            <button type="button" class="register-btn" onclick="window.location.href='notice-form.html'">등록</button>
        </div>
        <!-- 페이지네이션 -->
        <div id="pagination"></div>
    </div>
    <!-- 게시물 상세보기 영역 -->
    <div id="postDetailSection"></div>
    <!-- 외부 JS 로딩 -->
</body>
</html>
