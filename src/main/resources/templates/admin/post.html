<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <title>게시물 관리</title>
    <link rel="stylesheet" href="/css/post-style.css">
</head>

<body>
    <h2>게시물 관리</h2>
    <!-- 게시물 목록 영역 -->
    <div id="tableContainer">
        <div id="searchContainer">
            <!-- 필터 선택 -->
            <select id="filterType">
                <option value="all">전체</option>
                <option value="notice">공지</option>
                <option value="movie">영화</option>
            </select>
            <!-- 검색 입력 -->
            <input type="text" id="searchInput" placeholder="제목, 내용, 작성자 검색" />
        </div>
        <!-- 게시물 테이블 -->
        <table id="postTable">
            <thead>
                <tr>
                    <th>번호</th>
                    <th>제목</th>
                    <th>내용</th>
                    <th>작성자</th>
                    <th>수정일</th>
                    <th>조회수</th>
                    <th>관리</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
        <!-- 게시물 등록 버튼 -->
        <div class="button-wrapper">
            <button class="register-btn" onclick="window.location.href='notice-form.html'">게시물 등록</button>
        </div>
        <!-- 페이지네이션 영역 -->
        <div id="pagination"></div>
    </div>
    <!-- 상세 보기 영역 -->
    <div id="postDetailSection"></div>

    <script src="/js/post.js"></script>
</body>
</html>
