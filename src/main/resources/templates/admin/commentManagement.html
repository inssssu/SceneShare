<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>코멘트/댓글 관리자 페이지</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-LN+7fdVzj6u52u30Kp6M/trliBMCMKTyK833zpbD+pXdCLuTusPj697FH4R/5mcr" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js" integrity="sha384-ndDqU0Gzau9qJ1lfW4pNLlhNTkCfHzAVBReH9diLvGRem5+R9g2FzA8ZGN954O5Q" crossorigin="anonymous"></script>

<!--    <script src="/js/commentManagement.js"></script>-->

</head>

<body>
<div class="container mt-5">
    <div class="row">
        <a href="/admin/userManagement">유저관리</a>
        <a href="/admin/movieManagement">영화 정보 관리</a>
        <a href="/admin/comment">코멘트, 댓글 관리</a>
    </div>
    <!-- 관리자 페이지 제목 -->
    <h1 class="text-center">코멘트/댓글 관리자 페이지</h1>

    <!-- 검색바 입력 -->
    <div class="d-flex justify-content-end mb-3">
        <input type="text" placeholder="사용자 ID, 이름 또는 코멘트 내용 검색" />
    </div>

    <!-- 사용자 테이블 -->
    <table class="table table-hover table-striped text-center">
        <thead>
        <tr>
            <th>번호</th>
            <th>가입일</th>
            <th>사용자 ID</th>
            <th>이름</th>
            <th>상태</th>
            <th>관리</th>
        </tr>
        </thead>
        <tbody>
            <tr th:if="${#lists.size(userList)} > 0" th:each="item : ${userList}"
                th:onclick="|location.href='@{/admin/commentDetail/{userIdx}(userIdx=${item.userIdx})}'|" style="cursor:pointer;">
                <td th:text="${item.userIdx}"></td>
                <td>가입일</td>
                <td th:text="${item.username}"></td>
                <td th:text="${item.name}"></td>
                <td>상태</td>
                <td>관리</td>
            </tr>
        </tbody>
    </table>

    <!-- 페이징 영역 -->
    <div id="pagination"></div>
</div>

</body>
</html>
