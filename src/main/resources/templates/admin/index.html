<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>사용자 관리</title>
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <h2>사용자 관리</h2>
    <div class="search-bar-container">
        <input type="text" id="searchInput" placeholder="아이디 또는 이름 검색">
    </div>
    <table class="data-table" id="userTable">
        <thead>
            <tr>
                <th class="col-no">번호</th>
                <th class="col-id">아이디</th>
                <th class="col-status">상태</th>
                <th class="col-actions">관리</th>
            </tr>
        </thead>
        <tbody id="userTableBody"></tbody>
    </table>
    <div id="userDetailSection">
        <h3>사용자 상세정보</h3>
        <div class="info-row"><span class="label">아이디:</span><span id="detailId"></span></div>
        <div class="info-row"><span class="label">이름:</span><span id="detailName"></span></div>
        <div class="info-row"><span class="label">이메일:</span><span id="detailEmail"></span></div>
        <div class="info-row"><span class="label">성별:</span><span id="detailGender"></span></div>
        <div class="info-row"><span class="label">상태:</span><span id="detailStatus"></span></div>
        <div class="info-row"><span class="label">가입일:</span><span id="detailJoined"></span></div>
        <button class="back-btn" onclick="backToList()">← 뒤로가기</button>
    </div>
    <script src="/js/admin.js"></script>
</body>
</html>
